---
- name: Fetch the cosmoshub service binary
  vars:
    binary_version: "{{ vars[project][type].version }}"
    suffix_url: "gaiad-{{ binary_version }}-{{ ansible_system | lower }}-{{ system_architecture }}"
  ansible.builtin.get_url:
    url: "{{ vars[project][type].source_url }}/releases/download/{{ binary_version }}/{{ suffix_url }}"
    dest: "{{ node_bin_dir }}/{{ service_identifier }}"
    owner: root
    group: root
    force: true
    mode: "0755"
  notify:
    - Restart service
