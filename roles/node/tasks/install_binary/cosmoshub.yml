---
- name: Download public gaiad binary when secret binaries are disabled
  vars:
    suffix_url: "gaiad-{{ vars[project][type].version }}-{{ ansible_system | lower }}-{{ system_architecture }}"
  ansible.builtin.get_url:
    url: "{{ vars[project][type].source_url }}/{{ vars[project][type].version }}/{{ suffix_url }}"
    dest: "{{ node_bin_dir }}/{{ service_identifier }}"
    owner: root
    group: root
    mode: "0755"
    force: true
  notify:
    - Restart service
  when: not (fetch_secret_binaries | default(false) | bool)

- name: Install secret gaiad binary
  when: fetch_secret_binaries | default(false) | bool
  block:
    - name: Create a tmp directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}/{{ service_identifier }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download and unarchive the binary
      vars:
        suffix_url: "{{ vars[project][type].version }}/gaiad-{{ ansible_system | lower }}-{{ system_architecture }}.tar.gz"
      ansible.builtin.unarchive:
        src: "{{ vault.external.cosmoshub.private_source_url }}/{{ suffix_url }}"
        dest: "{{ tmp_dir }}/{{ service_identifier }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Copy the binary file
      ansible.builtin.copy:
        src: "{{ tmp_dir }}/{{ service_identifier }}/gaiad-{{ ansible_system | lower }}-{{ system_architecture }}/{{ node_service_default_binary_name[project] }}"
        dest: "{{ node_bin_dir }}/{{ service_identifier }}"
        remote_src: true
        owner: root
        group: root
        force: true
        mode: "0755"
      notify:
        - Restart service

    - name: Clean up the temporary files in /tmp
      ansible.builtin.file:
        path: "{{ tmp_dir }}/{{ service_identifier }}"
        state: absent
