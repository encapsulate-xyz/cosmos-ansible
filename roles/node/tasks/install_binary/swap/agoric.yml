---
- name: Get the checkout agoric currently runs from
  ansible.builtin.stat:
    path: "{{ node_bin_dir }}/{{ service_identifier }}"
  register: node_agoric_current_binary

- name: Point the agoric binary at the new checkout
  ansible.builtin.file:
    src: "{{ node_agoric_repo_dir }}/bin/{{ node_service_default_binary_name[project] }}"
    dest: "{{ node_bin_dir }}/{{ service_identifier }}"
    state: link
  register: node_agoric_binary_link
  notify:
    - Restart service

# not a handler: this must run right after the swap, while node_agoric_current_binary still names the old checkout
- name: Find old agoric checkouts # noqa: no-handler
  ansible.builtin.find:
    paths: "{{ node_home_dir }}"
    patterns: ".agoric-repo*"
    excludes:
      - "{{ node_agoric_repo_dir | basename }}"
      - "{{ node_agoric_current_binary.stat.lnk_target | default('') | dirname | dirname | basename }}"
    file_type: directory
    hidden: true
  register: node_agoric_old_checkouts
  when: node_agoric_binary_link is changed

- name: Remove old agoric checkouts
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ node_agoric_old_checkouts.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
