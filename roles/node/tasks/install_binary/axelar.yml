---
- name: Fetch the axelar service binary
  vars:
    suffix_url: >-
      {{ node_service_default_binary_name[project] }}-{{ ansible_system | lower }}-{{ system_architecture }}-{{ axelar[type].version }}
  ansible.builtin.get_url:
    url: "{{ axelar[type].source_url }}/{{ axelar[type].version }}/{{ suffix_url }}-static"
    dest: "{{ node_staged_binary }}"
    owner: root
    group: root
    force: true
    mode: "0755"
  when: not (fetch_secret_binaries | default(false) | bool)

- name: Fetch the axelar service secret binary
  vars:
    suffix_url: >-
      {{ node_service_default_binary_name[project] }}-{{ ansible_system | lower }}-{{ system_architecture }}-{{ axelar[type].version }}
  ansible.builtin.get_url:
    url: "{{ vault.external.axelar.private_source_url }}/{{ axelar[type].version }}/{{ suffix_url }}-static"
    dest: "{{ node_staged_binary }}"
    owner: root
    group: root
    force: true
    mode: "0755"
  when: fetch_secret_binaries | default(false) | bool
