---
- name: Download gravity binary
  vars:
    suffix_url: "gravity-{{ ansible_system | lower }}-{{ system_architecture }}"
  ansible.builtin.get_url:
    url: "{{ lookup('vars', project)[type].source_url }}/{{ lookup('vars', project)[type].version }}/{{ suffix_url }}"
    dest: "{{ node_staged_binary }}"
    owner: root
    group: root
    mode: "0755"
    force: true
