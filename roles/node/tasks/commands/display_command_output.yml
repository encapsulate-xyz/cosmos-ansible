---
- name: Pull the last line (pure JSON) and parse it
  ansible.builtin.set_fact:
    node_tx_json: "{{ (node_command_result.stdout.split('\n') | last) | from_json }}"

- name: Extract interesting fields
  ansible.builtin.set_fact:
    node_txhash: "{{ node_tx_json.txhash | default('Command didnt go through') }}"
    node_code: "{{ node_tx_json.code | default('Command didnt go through') }}"
    node_raw_log: "{{ node_tx_json.raw_log | default('Command didnt go through') }}"

- name: Show tx hash, code and raw-log
  ansible.builtin.debug:
    msg:
      Code: "{{ node_code }}"
      TX Hash: "{{ node_txhash }}"
      Raw Log: "{{ node_raw_log }}"
