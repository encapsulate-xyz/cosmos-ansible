---
- name: Withdraw validator rewards
  block:
    - name: Get validator address
      ansible.builtin.expect:
        command: >
          {{ node_bin_dir }}/{{ service_identifier }} keys show {{ key_name }} --bech val --output json --home {{ node_home_dir }}
        responses:
          "Enter keyring passphrase.*:": "{{ lookup('env', 'KEYRING_PASSWORD') }}\n"
      register: node_validator_status
      failed_when: node_validator_status.rc != 0

    - name: Debug raw output
      ansible.builtin.debug:
        msg: "{{ node_validator_status.stdout }}"

    - name: Extract validator address
      ansible.builtin.set_fact:
        node_validator: "{{ node_validator_status.stdout.split('\n')[-1] | from_json | json_query('address') }}"

    - name: Show the final validator
      ansible.builtin.debug:
        msg: "Validator address is: {{ node_validator }}"

    - name: Withdraw rewards
      ansible.builtin.expect:
        command: >
          {{ node_bin_dir }}/{{ service_identifier }} tx distribution withdraw-rewards {{ node_validator }}
          --commission
          --yes
          --from {{ key_name }}
          --chain-id {{ lookup('vars', project).chain_id }}
          --home {{ node_home_dir }}
          --node tcp://localhost:{{ rpc_port }}
          --output json
          --gas-prices {{ node_network_params.gas_price }}{{ node_network_params.denom }}
          --keyring-dir {{ node_home_dir }}
          --sign-mode direct
        responses:
          "Enter keyring passphrase.*:": "{{ lookup('env', 'KEYRING_PASSWORD') }}\n"
      register: node_withdraw_output
      failed_when:
        - node_withdraw_output.rc != 0
        - ((node_withdraw_output.stdout | regex_search('code:\\s*(\\d+)', '\\1')) | default('0') | int) != 0

  always:
    - name: Prase withdraw validator rewards command output and store in variable
      ansible.builtin.set_fact:
        node_command_result: "{{ node_withdraw_output }}"
      when: node_withdraw_output.rc == 0

    - name: Include display command output task
      ansible.builtin.import_tasks: display_command_output.yml
      when: node_withdraw_output.rc == 0
