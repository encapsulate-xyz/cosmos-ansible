---
- name: Set up tofnd
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [tofnd]
  vars_files:
    - group_vars/ports.yml
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml
  pre_tasks:
    - name: Include environment setup tasks
      when: type in allowed_node_types
      ansible.builtin.include_tasks: tasks/setup_environment.yml
  tasks:
    - name: Setup environment and run bridge role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include tofnd role
          ansible.builtin.include_role:
            name: tofnd
            public: true
  post_tasks:
    - name: Verify tofnd
      when: type in allowed_node_types
      block:
        # tofnd serves gRPC only, so there is no HTTP health check
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ tofnd_log_file_path }}"
            version_command: "{{ tofnd_bin_dir }}/{{ service_identifier }} --version"
            # tofnd prints "tofnd 0.10.1"
            expected_version: "{{ axelar.tofnd.version | regex_replace('^v', '') }}"
