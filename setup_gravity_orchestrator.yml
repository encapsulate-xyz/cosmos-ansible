---
- name: Set up Gravity Orchestrator
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [orchestrator]
  vars_files:
    - group_vars/ports.yml
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Include environment setup tasks
      ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run gravity_orchestrator playbook
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include gravity_orchestrator role
          ansible.builtin.include_role:
            name: gravity_orchestrator
            public: true

  post_tasks:
    - name: Verify gravity orchestrator
      block:
        # gbt v1.14.2 reports 1.14.1, and its metrics server only starts once the node is synced,
        # so there is no version or health check
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ gravity_orchestrator_log_file_path }}"
