---
- name: Set up Steward
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [steward]
  vars_files:
    - group_vars/ports.yml
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Include environment setup tasks
      ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run steward playbook
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include steward role
          ansible.builtin.include_role:
            name: steward
            public: true

  post_tasks:
    - name: Verify steward
      block:
        # steward serves gRPC over TLS only, so there is no HTTP health check
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ steward_log_file_path }}"
            version_command: "{{ steward_bin_dir }}/{{ service_identifier }} --version"
            # steward prints "steward 4.2.7"
            expected_version: "{{ sommelier.steward.version | regex_replace('^v', '') }}"
