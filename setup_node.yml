---
- name: Set up cosmos node
  hosts: all
  become: true
  gather_facts: true
  # get_url defaults to a 10s timeout, which roles like fubarhouse.golang don't override
  module_defaults:
    ansible.builtin.get_url:
      timeout: 120
  vars:
    allowed_node_types: [validator, fullnode]
  vars_files:
    - group_vars/ports.yml
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/default.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment and dependencies
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml
        - name: Include dependencies setup tasks
          ansible.builtin.include_tasks: tasks/setup_dependencies.yml
        - name: Include Go download tasks
          ansible.builtin.include_tasks: tasks/download_go.yml
          when: vars[project][type].go.version is defined

  tasks:
    - name: Run node playbook
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include node role
          ansible.builtin.include_role:
            name: node
