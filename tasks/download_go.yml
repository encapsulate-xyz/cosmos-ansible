---
# The fubarhouse.golang role downloads Go with a fixed 10s timeout and no retries,
# so a slow mirror fails the whole run. Fetch the tarball here with a longer timeout,
# retries and the upstream checksum, then hand that checksum to the role
# (go_checksum in the role's meta), so it finds the file in place and skips the download.
- name: Check installed Go version
  ansible.builtin.command: "{{ go.root }}/bin/go version"
  register: go_installed_version
  changed_when: false
  failed_when: false

- name: Download Go distribution
  when: ('go' ~ go_target_version ~ ' ') not in (go_installed_version.stdout | default(''))
  vars:
    go_target_version: "{{ vars[project][type].go.version }}"
    go_tarball: "go{{ go_target_version }}.{{ ansible_system | lower }}-{{ system_architecture }}.tar.gz"
  block:
    - name: Download Go tarball with retries
      ansible.builtin.get_url:
        url: "{{ go.mirror }}/{{ go_tarball }}"
        dest: "{{ tmp_dir }}/{{ go_tarball }}"
        checksum: "sha256:{{ go.mirror }}/{{ go_tarball }}.sha256"
        timeout: 120
        mode: "0644"
      register: go_download
      retries: 5
      delay: 10
      until: go_download is succeeded

    - name: Read Go tarball checksum
      ansible.builtin.stat:
        path: "{{ tmp_dir }}/{{ go_tarball }}"
        checksum_algorithm: sha256
      register: go_tarball_stat

    - name: Pass Go tarball checksum to the golang role
      ansible.builtin.set_fact:
        go_tarball_checksum: "sha256:{{ go_tarball_stat.stat.checksum }}"
